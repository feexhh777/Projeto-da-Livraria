
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - LEArning</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body
    class="h-screen flex items-center justify-center
    bg-gray-200 overflow-hidden font-sans"
>


    <div
        class="w-[500px] h-[700px]
        bg-white p-10 rounded-[25px]
        shadow-xl"
    >


        <!-- ÍCONE -->

        <div
            class="w-[100px] h-[100px]
            bg-indigo-200 rounded-full
            mx-auto mb-5
            flex items-center justify-center
            text-[40px]"
        >

            🧑‍🎓

        </div>


        <!-- TÍTULO -->

        <h1
            class="text-center text-[75px]
            font-bold text-slate-900 mb-2"
        >

            Login

        </h1>


        <p
            class="text-center
            text-slate-500
            text-lg
            mb-10"
        >

            Faça login para continuar
            para a area de administração!

        </p>


        <!-- FORMULÁRIO -->

        <form id="loginform">


            <!-- CPF -->

            <div class="mb-5">

                <label
                    for="cpf"
                    class="block
                    mb-2
                    text-[20px]
                    font-bold
                    text-slate-900"
                >

                    CPF

                </label>


                <input
                    type="text"
                    id="cpf"
                    maxlength="14"
                    inputmode="numeric"
                    placeholder="000.000.000-00"
                    autocomplete="username"
                    class="w-full
                    h-[60px]
                    border
                    border-slate-300
                    rounded-2xl
                    pl-5
                    text-lg
                    transition
                    focus:outline-none
                    focus:border-blue-600
                    focus:shadow-lg"
                >

            </div>


            <!-- SENHA -->

            <div class="mb-8">

                <label
                    for="senha"
                    class="block
                    mb-2
                    text-[20px]
                    font-bold
                    text-slate-900"
                >

                    Senha

                </label>


                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    class="w-full
                    h-[60px]
                    border
                    border-slate-300
                    rounded-2xl
                    pl-5
                    text-lg
                    transition
                    focus:outline-none
                    focus:border-blue-600
                    focus:shadow-lg"
                >

            </div>


            <!-- BOTÃO -->

            <button
                type="submit"
                id="botaoLogin"
                class="w-full
                h-[60px]
                rounded-2xl
                bg-gradient-to-r
                from-blue-600
                to-blue-700
                text-white
                text-[22px]
                font-bold
                transition
                hover:scale-[1.02]"
            >

                Entrar

            </button>


        </form>


        <!-- MENSAGEM -->

        <p
            id="mensagemLogin"
            class="text-center
            font-bold
            mt-5"
        >
        </p>


        <!-- RODAPÉ -->

        <div
            class="text-center
            mt-10
            text-slate-900"
        >

            © 2026 LEArning

        </div>


    </div>

    <script src="../scripts/login.js"></script>
    
</body>

</html>
