
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <script src="../scripts/protecao_adm.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <title>Empréstimos - LEArning</title>

</head>


<body
    class="bg-slate-100
    min-h-screen
    font-sans
    text-slate-800"
>


    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header
        class="bg-gradient-to-br
        from-blue-800
        via-blue-700
        to-blue-500
        text-white
        rounded-b-[40px]
        shadow-lg
        px-6
        py-8
        mb-8"
    >

        <div
            class="max-w-5xl
            mx-auto"
        >

            <div
                class="flex
                items-center
                gap-4"
            >

                <div
                    class="w-14
                    h-14
                    bg-white/15
                    backdrop-blur-sm
                    rounded-2xl
                    flex
                    items-center
                    justify-center
                    text-3xl
                    shadow-inner"
                >

                    📚

                </div>


                <div>

                    <h1
                        class="text-3xl
                        md:text-4xl
                        font-extrabold
                        tracking-tight"
                    >

                        Empréstimos

                    </h1>


                    <p
                        class="text-blue-100
                        mt-1"
                    >

                        Registre, localize e devolva livros da biblioteca.

                    </p>

                </div>

            </div>

        </div>

    </header>



    <main
        class="max-w-5xl
        mx-auto
        px-5
        pb-12"
    >


        <!-- =================================================
             NOVO EMPRÉSTIMO
        ================================================== -->

        <section
            class="bg-white
            rounded-3xl
            shadow-md
            border
            border-slate-200
            overflow-hidden
            mb-8"
        >


            <!-- TÍTULO DA SEÇÃO -->

            <div
                class="px-6
                md:px-8
                pt-7
                pb-5
                border-b
                border-slate-100"
            >

                <div
                    class="flex
                    items-center
                    gap-3"
                >

                    <div
                        class="w-11
                        h-11
                        rounded-xl
                        bg-blue-100
                        text-blue-700
                        flex
                        items-center
                        justify-center
                        text-xl"
                    >

                        📖

                    </div>


                    <div>

                        <h2
                            class="text-2xl
                            font-bold
                            text-slate-900"
                        >

                            Novo empréstimo

                        </h2>


                        <p
                            class="text-sm
                            text-slate-500
                            mt-1"
                        >

                            Informe os dados do aluno e selecione o livro.

                        </p>

                    </div>

                </div>

            </div>



            <!-- FORMULÁRIO -->

            <form
                id="formEmprestimo"
                class="p-6 md:p-8"
            >


                <div
                    class="grid
                    grid-cols-1
                    md:grid-cols-2
                    gap-5"
                >


                    <!-- NOME -->

                    <div
                        class="md:col-span-2"
                    >

                        <label
                            for="nomeAluno"
                            class="block
                            mb-2
                            text-sm
                            font-bold
                            text-slate-700"
                        >

                            Nome do aluno

                        </label>


                        <input
                            type="text"
                            id="nomeAluno"
                            placeholder="Digite o nome completo"
                            class="w-full
                            border
                            border-slate-300
                            rounded-xl
                            px-4
                            py-3
                            bg-slate-50
                            transition
                            duration-200
                            focus:outline-none
                            focus:ring-2
                            focus:ring-blue-500/30
                            focus:border-blue-500
                            focus:bg-white"
                        >

                    </div>



                    <!-- SALA -->

                    <div>

                        <label
                            for="sala"
                            class="block
                            mb-2
                            text-sm
                            font-bold
                            text-slate-700"
                        >

                            Sala

                        </label>


                        <input
                            type="text"
                            id="sala"
                            placeholder="Ex: 2B"
                            class="w-full
                            border
                            border-slate-300
                            rounded-xl
                            px-4
                            py-3
                            bg-slate-50
                            transition
                            duration-200
                            focus:outline-none
                            focus:ring-2
                            focus:ring-blue-500/30
                            focus:border-blue-500
                            focus:bg-white"
                        >

                    </div>



                    <!-- ANO -->

                    <div>

                        <label
                            for="anoAluno"
                            class="block
                            mb-2
                            text-sm
                            font-bold
                            text-slate-700"
                        >

                            Ano

                        </label>


                        <input
                            type="text"
                            id="anoAluno"
                            placeholder="Ex: 2º ano"
                            class="w-full
                            border
                            border-slate-300
                            rounded-xl
                            px-4
                            py-3
                            bg-slate-50
                            transition
                            duration-200
                            focus:outline-none
                            focus:ring-2
                            focus:ring-blue-500/30
                            focus:border-blue-500
                            focus:bg-white"
                        >

                    </div>



                    <!-- LIVRO -->

                    <div
                        class="md:col-span-2"
                    >

                        <label
                            for="livro"
                            class="block
                            mb-2
                            text-sm
                            font-bold
                            text-slate-700"
                        >

                            Livro

                        </label>


                        <select
                            id="livro"
                            class="w-full
                            border
                            border-slate-300
                            rounded-xl
                            px-4
                            py-3
                            bg-slate-50
                            transition
                            duration-200
                            focus:outline-none
                            focus:ring-2
                            focus:ring-blue-500/30
                            focus:border-blue-500
                            focus:bg-white"
                        >

                            <option value="">

                                Carregando livros...

                            </option>

                        </select>

                    </div>

                </div>



                <!-- BOTÃO -->

                <button
                    type="submit"
                    id="botaoEmprestimo"
                    class="w-full
                    mt-7
                    bg-gradient-to-r
                    from-blue-700
                    to-blue-600
                    hover:from-blue-800
                    hover:to-blue-700
                    active:scale-[0.99]
                    text-white
                    font-bold
                    py-3.5
                    rounded-xl
                    shadow-md
                    hover:shadow-lg
                    transition
                    duration-200"
                >

                    📚 Registrar empréstimo

                </button>


            </form>



            <!-- MENSAGEM -->

            <div
                class="px-6
                md:px-8
                pb-6"
            >

                <p
                    id="mensagemEmprestimo"
                    class="text-center
                    font-bold
                    min-h-[24px]"
                >
                </p>

            </div>

        </section>



        <!-- =================================================
             EMPRÉSTIMOS ATUAIS
        ================================================== -->

        <section
            class="bg-white
            rounded-3xl
            shadow-md
            border
            border-slate-200
            overflow-hidden"
        >


            <!-- TÍTULO -->

            <div
                class="px-6
                md:px-8
                pt-7
                pb-5
                border-b
                border-slate-100"
            >

                <div
                    class="flex
                    items-center
                    gap-3"
                >

                    <div
                        class="w-11
                        h-11
                        rounded-xl
                        bg-orange-100
                        text-orange-600
                        flex
                        items-center
                        justify-center
                        text-xl"
                    >

                        🔎

                    </div>


                    <div>

                        <h2
                            class="text-2xl
                            font-bold
                            text-slate-900"
                        >

                            Livros emprestados

                        </h2>


                        <p
                            class="text-sm
                            text-slate-500
                            mt-1"
                        >

                            Pesquise pelo nome do aluno ou pelo livro.

                        </p>

                    </div>

                </div>

            </div>



            <!-- PESQUISA -->

            <div
                class="p-6
                md:p-8
                pb-4"
            >

                <div
                    class="relative"
                >

                    <span
                        class="absolute
                        left-4
                        top-1/2
                        -translate-y-1/2
                        text-slate-400
                        text-lg"
                    >

                        🔍

                    </span>


                    <input
                        type="text"
                        id="pesquisaEmprestimo"
                        placeholder="Digite o nome do aluno ou livro..."
                        class="w-full
                        border
                        border-slate-300
                        rounded-xl
                        pl-11
                        pr-4
                        py-3
                        bg-slate-50
                        transition
                        duration-200
                        focus:outline-none
                        focus:ring-2
                        focus:ring-blue-500/30
                        focus:border-blue-500
                        focus:bg-white"
                    >

                </div>

            </div>



            <!-- LISTA -->

            <div
                id="listaEmprestimos"
                class="px-6
                md:px-8
                pb-8
                mt-2"
            >

                <p
                    class="text-center
                    text-slate-500
                    py-8"
                >

                    Carregando empréstimos...

                </p>

            </div>

        </section>


    </main>



    <!-- =====================================================
         VOLTAR
    ====================================================== -->

    <div
        class="text-center
        pb-10
        px-5"
    >

        <button
            onclick="window.location.href='home_adm.html'"
            class="inline-flex
            items-center
            justify-center
            gap-2
            bg-white
            hover:bg-slate-50
            text-slate-700
            font-bold
            py-3
            px-7
            rounded-xl
            border
            border-slate-300
            shadow-sm
            hover:shadow-md
            transition
            duration-200"
        >

            ← Voltar para Home

        </button>

    </div>



    <script src="../scripts/emprestimos.js"></script>

</body>

</html>
