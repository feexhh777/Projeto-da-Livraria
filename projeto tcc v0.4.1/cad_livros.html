<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>cadastro de livros</title>
</head>
<body>

    <form id="loginform">

            <div class="mb-3">

                <label class="block mb-2 text-[17px] font-bold text-slate-900">
                    Titulo do livro
                </label>

                <input 
                    type="text"
                    id="titulo"
                    placeholder="Digite o titulo do livro"

                    class="text-medium border border-blue-200
                    "
                >

            </div>

            <div class="mb-3">

                <label class="block mb-2 text-[17px] font-bold text-slate-900">
                    Autor do livro
                </label>

                <input 
                    type=""
                    id="autor"
                    placeholder="Digite o autor do livro"
                    class="border border-blue-200
                    "
                >

            </div>

            <div class="mb-3">

                <label class="block mb-2 text-[17px] font-bold text-slate-900">
                    Editora do livro
                </label>

                <input 
                    type=""
                    id="editora"
                    placeholder="Digite a editora do livro "
                    class="border border-blue-200
                     "
                >

            </div>

            <div class="mb-3">

                <label class="block mb-2 text-[17px] font-bold text-slate-900">
                    ISBN
                </label>

                <input 
                    type=""
                    id="isbn"
                    placeholder="Digite a ISBN do livro"
                    class="border border-blue-200
                    "
                >

            </div>
            <div class="mb-7">

                <label class="block mb-2 text-[17px] font-bold text-slate-900">
                    Genero do livro
                </label>

                <input 
                    type="text"
                    id="genero"
                    placeholder="Digite o genero do livro"
                    class="border border-blue-200
                    "
                >

            </div>

        </form>
        <div class="mb-10">

        <button class="bg-teal-200 rounded border border-black">confirmar</button> <br>
</div>
    <button class="bg-orange-200 text-black font-bold py-2 px-3 rounded border border-black rounded tra"
     onclick="window.location.href='home.html'">
    Voltar para Home


</button>
    
</body>
</html>
