<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Nós</title>
    <!-- Importação correta do Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 font-sans flex flex-col items-center justify-between p-6">

    <!-- Cabeçalho principal -->
    <header class="text-center my-6">
        <h1 class="text-4xl font-extrabold text-gray-800 tracking-tight mb-2">Bem-Vindo</h1>
        <p class="text-lg text-gray-600 max-w-xl mx-auto">
            Olá! Esta página contém as informações dos indivíduos envolvidos na criação deste TCC.
        </p>
    </header>

    <!-- Grid Responsivo para os Integrantes -->
    <main class="container mx-auto max-w-6xl my-auto">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6 justify-items-center">
            
            <!-- Integrante 1 -->
            <div class="bg-white p-4 rounded-xl shadow-md text-center w-full max-w-[220px] border border-gray-200">
                <h2 class="text-sm font-bold text-orange-500 uppercase tracking-wider mb-1">LÍDER / Front-End</h2>
                <p class="text-lg font-semibold text-gray-700 mb-3">Fernando</p>
                <img src="Fernando.jpg" alt="Fernando" class="w-full h-48 object-cover rounded-lg shadow-sm">
            </div>

            <!-- Integrante 2 -->
            <div class="bg-white p-4 rounded-xl shadow-md text-center w-full max-w-[220px] border border-gray-200">
                <h2 class="text-sm font-bold text-orange-500 uppercase tracking-wider mb-1">Banco de Dados</h2>
                <p class="text-lg font-semibold text-gray-700 mb-3">Vitória</p>
                <img src="Vitoria.jpg" alt="Vitória" class="w-full h-48 object-cover rounded-lg shadow-sm">
            </div>

            <!-- Integrante 3 -->
            <div class="bg-white p-4 rounded-xl shadow-md text-center w-full max-w-[220px] border border-gray-200">
                <h2 class="text-sm font-bold text-orange-500 uppercase tracking-wider mb-1">Back-End</h2>
                <p class="text-lg font-semibold text-gray-700 mb-3">Victor</p>
                <img src="Victor.jpg" alt="Victor" class="w-full h-48 object-cover rounded-lg shadow-sm">
            </div>

            <!-- Integrante 4 -->
            <div class="bg-white p-4 rounded-xl shadow-md text-center w-full max-w-[220px] border border-gray-200">
                <h2 class="text-sm font-bold text-orange-500 uppercase tracking-wider mb-1">Design</h2>
                <p class="text-lg font-semibold text-gray-700 mb-3">Raul</p>
                <img src="Raul.png.jpeg" alt="Raul" class="w-full h-48 object-cover rounded-lg shadow-sm">
            </div>

            <!-- Integrante 5 -->
            <div class="bg-white p-4 rounded-xl shadow-md text-center w-full max-w-[220px] border border-gray-200">
                <h2 class="text-sm font-bold text-orange-500 uppercase tracking-wider mb-1">Inteligência Artificial</h2>
                <p class="text-lg font-semibold text-gray-700 mb-3">Mabelli</p>
                <img src="mabelli.jpeg" alt="Mabelli" class="w-full h-48 object-cover rounded-lg shadow-sm">
            </div>

        </div>
    </main>

    <!-- Rodapé com Botão de Voltar -->
    <footer class="w-full text-center my-6">
        <button onclick="window.location.href='home.html'" 
                class="bg-orange-400 hover:bg-orange-500 text-gray-900 font-bold py-2.5 px-6 rounded-lg border border-orange-300 shadow transition duration-200 ease-in-out transform hover:-translate-y-0.5">
            Voltar para Home
        </button>
    </footer>

</body>
</html>
