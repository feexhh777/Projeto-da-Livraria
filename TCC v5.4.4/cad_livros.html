<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="protecao_adm.js"></script>
    <title>Cadastro de Livros</title>
</head>

<body class="bg-slate-100 min-h-screen p-6">

    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-8">

        <h1 class="text-3xl font-bold text-slate-900 mb-2">
            Cadastro de Livros
        </h1>

        <p class="text-slate-500 mb-8">
            Cadastre um novo livro no acervo da biblioteca.
        </p>


        <form id="formlivro">

            <!-- TÍTULO -->

            <div class="mb-5">

                <label
                    for="titulo"
                    class="block mb-2 text-lg font-bold text-slate-900">

                    Título do livro

                </label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o título do livro"
                    class="w-full border border-slate-300 rounded-xl p-3
                    focus:outline-none focus:border-blue-600">

            </div>


            <!-- AUTOR -->

            <div class="mb-5">

                <label
                    for="autor"
                    class="block mb-2 text-lg font-bold text-slate-900">

                    Autor

                </label>

                <input
                    type="text"
                    id="autor"
                    placeholder="Digite o autor do livro"
                    class="w-full border border-slate-300 rounded-xl p-3
                    focus:outline-none focus:border-blue-600">

            </div>


            <!-- EDITORA -->

            <div class="mb-5">

                <label
                    for="editora"
                    class="block mb-2 text-lg font-bold text-slate-900">

                    Editora

                </label>

                <input
                    type="text"
                    id="editora"
                    placeholder="Digite a editora"
                    class="w-full border border-slate-300 rounded-xl p-3
                    focus:outline-none focus:border-blue-600">

            </div>


            <!-- ISBN -->

            <div class="mb-5">

                <label
                    for="isbn"
                    class="block mb-2 text-lg font-bold text-slate-900">

                    ISBN

                </label>

                <input
                    type="text"
                    id="isbn"
                    placeholder="Digite o ISBN"
                    class="w-full border border-slate-300 rounded-xl p-3
                    focus:outline-none focus:border-blue-600">

            </div>


            <!-- GÊNERO -->

            <div class="mb-5">

                <label
                    for="genero"
                    class="block mb-2 text-lg font-bold text-slate-900">

                    Gênero

                </label>

                <input
                    type="text"
                    id="genero"
                    placeholder="Digite o gênero"
                    class="w-full border border-slate-300 rounded-xl p-3
                    focus:outline-none focus:border-blue-600">

            </div>


            <!-- ANO -->

            <div class="mb-5">

                <label
                    for="ano"
                    class="block mb-2 text-lg font-bold text-slate-900">

                    Ano

                </label>

                <input
                    type="number"
                    id="ano"
                    placeholder="Ex: 2020"
                    class="w-full border border-slate-300 rounded-xl p-3
                    focus:outline-none focus:border-blue-600">

            </div>


            <!-- QUANTIDADE -->

            <div class="mb-7">

                <label
                    for="quantidade"
                    class="block mb-2 text-lg font-bold text-slate-900">

                    Quantidade de exemplares

                </label>

                <input
                    type="number"
                    id="quantidade"
                    min="1"
                    value="1"
                    class="w-full border border-slate-300 rounded-xl p-3
                    focus:outline-none focus:border-blue-600">

            </div>


            <!-- BOTÃO -->

            <button
                type="submit"
                id="botaoCadastrar"
                class="w-full bg-blue-600 hover:bg-blue-700
                text-white font-bold py-3 rounded-xl transition">

                Cadastrar livro

            </button>

        </form>


        <!-- MENSAGEM -->

        <p
            id="mensagem"
            class="text-center font-bold mt-5">
        </p>


        <!-- VOLTAR -->

        <button
            onclick="window.location.href='home.html'"
            class="w-full mt-5 bg-orange-300 hover:bg-orange-400
            text-black font-bold py-3 rounded-xl border border-black">

            Voltar para Home

        </button>

    </div>


    <script src="cad_livros.js"></script>

</body>

</html>
