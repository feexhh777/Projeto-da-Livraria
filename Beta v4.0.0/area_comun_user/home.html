
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LEArning</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-slate-50 min-h-screen font-sans pb-24">


    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header
        class="bg-gradient-to-b from-purple-700 to-purple-500
        rounded-b-[40px] p-6 text-white shadow-lg"
    >

        <div class="flex justify-between items-center">

            <div>

                <h1 class="text-xl font-bold">
                    Olá, Leitor! 👋
                </h1>

                <p class="text-sm opacity-80">
                    Bem-vindo à sua Biblioteca Virtual
                </p>

            </div>


            <div
                class="w-11 h-11
                bg-white/20
                rounded-full
                flex items-center justify-center
                text-xl"
            >

                🔔

            </div>

        </div>


        <!-- PESQUISA -->

        <div
            class="mt-6
            bg-white
            rounded-full
            p-3
            flex items-center
            text-gray-400
            shadow-lg"
        >

            <span class="text-lg">
                🔍
            </span>


            <input
                id="pesquisaLivro"
                type="text"
                class="ml-3 outline-none w-full text-slate-800"
                placeholder="Buscar livros, autores ou categorias..."
            >

        </div>

    </header>



    <main class="p-5 max-w-5xl mx-auto">


        <!-- =================================================
             DESTAQUE
        ================================================== -->

        <!-- =================================================
             TOP 3 DA SEMANA
        ================================================== -->

        <section
            class="bg-gradient-to-br
            from-slate-900
            via-purple-700
            to-slate-600
            rounded-3xl
            p-6
            text-white
            mt-4
            shadow-xl"
        >

            <div class="flex justify-between items-center gap-4 flex-wrap">

                <div>
                    <p class="text-sm text-purple-400 font-semibold">
                        📚 Mais emprestados
                    </p>

                    <h2 class="text-3xl font-bold mt-1">
                        Top 3 da semana
                    </h2>

                    <p class="text-sm text-slate-300 mt-1">
                        Os livros com mais empréstimos nos últimos 7 dias.
                    </p>
                </div>

                <button
                    onclick="window.location.href='livros.html'"
                    class="bg-white
                    text-purple-700
                    px-5 py-2
                    rounded-xl
                    font-bold
                    hover:bg-purple-100
                    transition"
                >
                    VER LIVROS
                </button>

            </div>

            <div
                id="top3Semana"
                class="grid grid-cols-1 lg:grid-cols-3 gap-4 mt-6"
            >
                <div class="bg-white/10 rounded-2xl p-6 text-center text-slate-300">
                    Carregando os livros mais emprestados...
                </div>
            </div>

        </section>


        <!-- =================================================
             CATEGORIAS
        ================================================== -->

        <div class="flex justify-between items-center mt-8">

            <h2 class="font-bold text-lg text-slate-900">
                Categorias
            </h2>


            <button
                onclick="window.location.href='livros.html'"
                class="text-purple-700 text-sm font-semibold"
            >

                Ver todas →

            </button>

        </div>



        <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3 mt-4">


            <button
                onclick="buscarCategoria('Romance')"
                class="bg-purple-50
                hover:bg-purple-100
                rounded-2xl
                p-4
                text-center
                transition
                shadow-sm"
            >

                <div class="text-2xl">
                    💙
                </div>

                <p class="text-xs font-semibold mt-1">
                    Romance
                </p>

            </button>



            <button
                onclick="buscarCategoria('História')"
                class="bg-green-50
                hover:bg-green-100
                rounded-2xl
                p-4
                text-center
                transition
                shadow-sm"
            >

                <div class="text-2xl">
                    🏛️
                </div>

                <p class="text-xs font-semibold mt-1">
                    História
                </p>

            </button>



            <button
                onclick="buscarCategoria('Desenvolvimento')"
                class="bg-purple-50
                hover:bg-purple-100
                rounded-2xl
                p-4
                text-center
                transition
                shadow-sm"
            >

                <div class="text-2xl">
                    💡
                </div>

                <p class="text-xs font-semibold mt-1">
                    Desenvolvimento
                </p>

            </button>



            <button
                onclick="buscarCategoria('Fantasia')"
                class="bg-pink-50 hover:bg-pink-100 rounded-2xl p-4 text-center transition shadow-sm"
            >
                <div class="text-2xl">🧙</div>
                <p class="text-xs font-semibold mt-1">Fantasia</p>
            </button>

            <button
                onclick="buscarCategoria('Ficção')"
                class="bg-indigo-50 hover:bg-indigo-100 rounded-2xl p-4 text-center transition shadow-sm"
            >
                <div class="text-2xl">🚀</div>
                <p class="text-xs font-semibold mt-1">Ficção</p>
            </button>

            <button
                onclick="buscarCategoria('Mistério')"
                class="bg-orange-50 hover:bg-orange-100 rounded-2xl p-4 text-center transition shadow-sm"
            >
                <div class="text-2xl">🔎</div>
                <p class="text-xs font-semibold mt-1">Mistério</p>
            </button>

            <button
                onclick="buscarCategoria('Biografia')"
                class="bg-teal-50 hover:bg-teal-100 rounded-2xl p-4 text-center transition shadow-sm"
            >
                <div class="text-2xl">👤</div>
                <p class="text-xs font-semibold mt-1">Biografia</p>
            </button>


            <button
                onclick="buscarCategoria('Natureza')"
                class="bg-yellow-50
                hover:bg-yellow-100
                rounded-2xl
                p-4
                text-center
                transition
                shadow-sm"
            >

                <div class="text-2xl">
                    🌳
                </div>

                <p class="text-xs font-semibold mt-1">
                    Natureza
                </p>

            </button>

        </div>



        <!-- =================================================
             LIVROS DISPONÍVEIS
        ================================================== -->

        <div class="flex justify-between items-center mt-8">

            <div>

                <h2 class="font-bold text-lg text-slate-900">
                    Livros disponíveis
                </h2>

                <p class="text-xs text-slate-500 mt-1">
                    Confira alguns livros da biblioteca
                </p>

            </div>


            <button
                onclick="window.location.href='livros.html'"
                class="text-purple-700 text-sm font-semibold"
            >

                Ver todos →

            </button>

        </div>



        <!-- LISTA DE LIVROS -->

        <div
            id="listaLivros"
            class="grid grid-cols-1 sm:grid-cols-2
            lg:grid-cols-3 gap-4 mt-4"
        >

            <div
                class="col-span-full bg-white rounded-2xl shadow-sm p-6 text-center text-slate-500"
            >
                Carregando livros...
            </div>

        </div>



        <!-- =================================================
             MENSAGEM DE PESQUISA
        ================================================== -->

        <div
            id="mensagemPesquisa"
            class="hidden
            bg-purple-50
            border border-purple-100
            text-purple-700
            rounded-xl
            p-4
            mt-5
            text-center
            font-semibold"
        >
        </div>


    </main>



    <!-- =====================================================
         MENU INFERIOR
    ====================================================== -->

    <nav
        class="fixed
        bottom-0
        left-0
        right-0
        bg-white
        border-t
        border-slate-200
        p-3
        flex
        justify-around
        items-center
        shadow-[0_-5px_20px_rgba(0,0,0,0.05)]"
    >
    
        <!-- LIVROS -->

        <button
            onclick="window.location.href='livros.html'"
            class="text-slate-600
            hover:text-purple-500
            text-center"
        >

            <div class="text-xl">
                📚
            </div>

            <small>
                Livros
            </small>

        </button>

        <!-- SOBRE -->

        <button
            onclick="window.location.href='sobre_nos.html'"
            class="text-slate-600
            hover:text-purple-500
            text-center"
        >

            <div class="text-xl">
                👥
            </div>

            <small>
                Sobre nós
            </small>

        </button>



        <!-- PERFIL -->

        <button
            onclick="window.location.href='login.html'"
            class="text-slate-600
            hover:text-purple-600
            text-center"
        >

            <div class="text-xl">
                👤
            </div>

            <small>
                Admin
            </small>

        </button>

    </nav>
    <script src="../scripts/home.js"></script>
</body>

</html>
