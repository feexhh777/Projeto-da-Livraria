<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Nós</title>
    <!-- Importação correta do Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-purple-100 font-sans flex flex-col justify-between p-8">

<header
        class="bg-gradient-to-b
        from-purple-700
        to-purple-500
        text-slate-100
        rounded-2xl
        shadow-lg
        px-6
        py-8
        mb-8"
    >

        <div
            class="max-w-3xl
            mx-auto"
        >

            <div
                class="flex
                items-center
                gap-4"
            >

                <div
                    class="w-14
                    h-14
                    bg-white/15
                    backdrop-blur-sm
                    rounded-2xl
                    flex
                    items-center
                    justify-center
                    text-3xl
                    shadow-inner"
                >

                    👤

                </div>


                <div>

                    <h1
                        class="text-3xl
                        md:text-4xl
                        font-extrabold
                        tracking-tight"
                    >

                        Sobre Nós

                    </h1>


                    <p
                        class="text-slate-100
                        mt-1"
                    >

                         Olá! Esta página contém as informações dos indivíduos envolvidos na criação deste TCC.

                    </p>

                </div>

            </div>

        </div>

    </header>

    <!-- Grid Responsivo para os Integrantes -->
    <main class="container mx-auto max-w-6xl my-auto">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6 justify-items-center">
            
            <!-- Integrante 1 -->
            <div class="bg-white p-4 rounded-xl shadow-md text-center w-full max-w-[220px] border border-gray-200">
                <h2 class="text-sm font-bold text-purple-500 uppercase tracking-wider mb-1">LÍDER / Front-End</h2>
                <p class="text-lg font-semibold text-gray-700 mb-3">Fernando</p>
                <img src="../fotos/Fernando.jpg" alt="Fernando" class="w-full h-48 object-cover rounded-lg shadow-sm">
            </div>

            <!-- Integrante 2 -->
            <div class="bg-white p-4 rounded-xl shadow-md text-center w-full max-w-[220px] border border-gray-200">
                <h2 class="text-sm font-bold text-purple-500 uppercase tracking-wider mb-1">Banco de Dados</h2>
                <p class="text-lg font-semibold text-gray-700 mb-3">Vitória</p>
                <img src="../fotos/Vitoria.jpg" alt="Vitória" class="w-full h-48 object-cover rounded-lg shadow-sm">
            </div>

            <!-- Integrante 3 -->
            <div class="bg-white p-4 rounded-xl shadow-md text-center w-full max-w-[220px] border border-gray-200">
                <h2 class="text-sm font-bold text-purple-500 uppercase tracking-wider mb-1">Back-End</h2>
                <p class="text-lg font-semibold text-gray-700 mb-3">Victor</p>
                <img src="../fotos/Victor.jpg" alt="Victor" class="w-full h-48 object-cover rounded-lg shadow-sm">
            </div>
        </div>
    </main>

    <!-- Rodapé com Botão de Voltar -->
    <footer class="w-full text-center my-6">
        <button onclick="window.location.href='home.html'" 
                class="bg-purple-400 hover:bg-purple-500 text-gray-900 font-bold py-2.5 px-6 rounded-lg border border-purple-300 shadow transition duration-200 ease-in-out transform hover:-translate-y-0.5">
            Voltar para Home
        </button>
    </footer>

</body>
</html>
